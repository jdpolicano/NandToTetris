[package]
name = "hackc"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
hack-assembler = { version = "0.1.0", path = "../hack-assembler" }
hack-vm-translator = { version = "0.1.0", path = "../hack-vm-translator" }
thiserror = "2"
tempfile = "3"
same-file = "1.0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
